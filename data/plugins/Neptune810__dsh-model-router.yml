url: https://github.com/Neptune810/dsh-model-router
name: Neptune810/dsh-model-router
category: model
description:
  en: Keeps a pool of models and routes every agent step to one of them with its reasoning effort set — configured by clicking in the composer, no JSON needed. Only ticked models are selectable; each carries a role (daily or heavy), a relative price and an optional vision tag. Three authorization scopes where a manual pick always wins, task presets with per-model weights, vision routing for image steps, session signals (active todo, context pressure, token budget, subagent depth), a /router command and an optional semantic task classifier. Thinking stays on, because DeepSeek rejects a thinking-enabled request whose history contains a tool call made with thinking off.
  zh: 维护一个模型池，把每个 agent 步骤路由到池内模型并设置其思考等级——全部在输入栏点选配置，不需要写 JSON。只有勾选的模型会被选中；每个模型可标「定位（日常/攻坚）」「价格（便宜/中/贵）」和可选的「视觉」标记。三种授权模式（你手动选过就自动让位，下一条命令或点「重新接管」恢复）、按任务类型给模型加权的预设、带图任务的视觉分流、会话信号（当前 todo / 上下文压力 / token 预算 / 子 agent 深度）、/router 命令，以及可选的语义任务分类。思考等级保持常开，因为 DeepSeek 会拒绝思考关闭时产生的工具调用。
