url: https://github.com/Neptune810/dsh-model-router
name: Neptune810/dsh-model-router
category: model
description:
  en: Routes each step to a model from a user-defined pool and sets its reasoning effort — low for cheap or plain requests, high for engineering work — while a manual pick always overrides the router. Three authorization scopes (model + effort, effort only, model only), task presets that weight models per task type including third-party providers, and thinking kept on because DeepSeek rejects a tool call made with thinking off.
  zh: 按用户定义的模型池为每个步骤选模型并设置思考等级——廉价/普通请求用 low，工程类工作用 high——你手动选的模型永远优先。三种授权模式（模型+思考、只调思考、只调模型）、按任务类型给模型加权的任务预设（支持第三方 provider），并保持思考常开，因为 DeepSeek 会拒绝关闭思考时产生的工具调用。
